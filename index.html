<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="logo.png" />
  <title>GPA Calculator</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-color: #1f2937;
      --text-secondary: #6b7280;
      --border-color: #e5e7eb;
      --input-bg: #f9fafb;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --success-bg: #d1fae5;
      --success-text: #065f46;
      --danger-bg: #fee2e2;
      --danger-text: #b91c1c;
    }

    [data-theme="dark"] {
      --primary-color: #6366f1;
      --primary-hover: #818cf8;
      --bg-color: #111827;
      --card-bg: #1f2937;
      --text-color: #f9fafb;
      --text-secondary: #d1d5db;
      --border-color: #374151;
      --input-bg: #374151;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.5), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
      --success-bg: #064e3b;
      --success-text: #ecfdf5;
      --danger-bg: #7f1d1d;
      --danger-text: #fef2f2;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      transition: background-color 0.3s ease, color 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      width: 100%;
      background-color: var(--card-bg);
      border-radius: 12px;
      box-shadow: var(--shadow-md);
      padding: 2rem;
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0;
      color: var(--primary-color);
    }

    h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0;
      color: var(--text-color);
    }

    .title-group {
      text-align: left;
    }

    /* Toggle Switch */
    .switch {
      font-size: 17px;
      position: relative;
      display: inline-block;
      width: 3.5em;
      height: 2em;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--primary-color);
      transition: .5s;
      border-radius: 30px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 1.4em;
      width: 1.4em;
      border-radius: 50%;
      left: 10%;
      bottom: 15%;
      box-shadow: inset 15px -4px 0px 15px #fff000;
      background: transparent;
      transition: .5s;
    }

    input:checked+.slider {
      background-color: #0d1117;
      /* Darker bg for night mode */
    }

    input:checked+.slider:before {
      transform: translateX(100%);
      box-shadow: inset 8px -4px 0px 0px #fff000;
    }

    .input-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .form-control {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: var(--text-secondary);
    }

    input {
      padding: 0.75rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: var(--input-bg);
      color: var(--text-color);
      font-size: 1rem;
      transition: border-color 0.2s, ring 0.2s;
      outline: none;
    }

    input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
      border: none;
      width: 100%;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
    }

    .btn-danger {
      background-color: #ef4444;
      color: white;
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      width: auto;
    }

    .btn-danger:hover {
      background-color: #dc2626;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin-top: 2rem;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    th,
    td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: var(--input-bg);
      font-weight: 600;
      font-size: 0.875rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background-color: rgba(0, 0, 0, 0.02);
    }

    [data-theme="dark"] tr:hover td {
      background-color: rgba(255, 255, 255, 0.02);
    }

    .grade-tag {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .grade-good {
      background-color: var(--success-bg);
      color: var(--success-text);
    }

    .grade-bad {
      background-color: var(--danger-bg);
      color: var(--danger-text);
    }

    .error-msg {
      color: #ef4444;
      font-size: 0.75rem;
      margin-top: 0.25rem;
      min-height: 1.25em;
      /* reserve space */
    }

    .result-area {
      margin-top: 2rem;
      padding: 1.5rem;
      background-color: var(--input-bg);
      border-radius: 8px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .gpa-display {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary-color);
      margin-top: 1rem;
    }

    footer {
      margin-top: auto;
      padding: 2rem;
      text-align: center;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
    }

    footer p {
      margin: 0;
      font-size: 0.95rem;
      color: var(--text-secondary);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .footer-name {
      background: linear-gradient(to right, var(--primary-color), #ec4899);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 800;
      font-size: 1.1rem;
      position: relative;
      cursor: pointer;
      transition: transform 0.3s ease;
      display: inline-block;
    }

    .footer-name:hover {
      transform: scale(1.05) rotate(-2deg);
    }

    .footer-name::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 2px;
      bottom: -2px;
      left: 0;
      background: linear-gradient(to right, var(--primary-color), #ec4899);
      transform: scaleX(0);
      transform-origin: bottom right;
      transition: transform 0.3s ease-out;
    }

    .footer-name:hover::after {
      transform: scaleX(1);
      transform-origin: bottom left;
    }

    @media (max-width: 640px) {
      .container {
        padding: 1rem;
      }

      .input-group {
        grid-template-columns: 1fr;
      }

      /* Responsive Table (Card View) */
      table,
      thead,
      tbody,
      th,
      td,
      tr {
        display: block;
      }

      thead tr {
        position: absolute;
        top: -9999px;
        left: -9999px;
      }

      table {
        border: none;
      }

      tr {
        margin-bottom: 1rem;
        background-color: var(--input-bg);
        border-radius: 12px;
        padding: 1rem;
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--border-color);
      }

      tr:last-child {
        margin-bottom: 0;
      }

      td {
        border: none;
        position: relative;
        padding: 0.5rem 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        text-align: right;
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        /* very light divider */
      }

      [data-theme="dark"] td {
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }

      td:last-child {
        border-bottom: none;
        padding-top: 1rem;
        margin-top: 0.5rem;
        justify-content: flex-end;
      }

      td::before {
        content: attr(data-label);
        font-weight: 600;
        color: var(--text-secondary);
        text-align: left;
        margin-right: 1rem;
      }

      td:last-child::before {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <div class="title-group">
        <h1>RSCI</h1>
        <h2>GPA Calculator</h2>
      </div>
      <label class="switch">
        <input type="checkbox" id="themeToggle">
        <span class="slider"></span>
      </label>
    </header>

    <div class="input-group">
      <div class="form-control">
        <label for="courseName">Course Name</label>
        <input type="text" id="courseName" placeholder="e.g. Mathematics" />
        <div class="error-msg" id="nameError"></div>
      </div>
      <div class="form-control">
        <label for="creditHours">Credit Hours</label>
        <input type="number" id="creditHours" placeholder="1-4" min="1" max="4" />
        <div class="error-msg" id="creditError"></div>
      </div>
      <div class="form-control">
        <label for="marks">Obtained Marks</label>
        <input type="number" id="marks" placeholder="0-100" />
        <div class="error-msg" id="marksError"></div>
      </div>
    </div>

    <button onclick="addCourse()" class="btn btn-primary">Add Course</button>

    <table id="courseTable">
      <thead>
        <tr>
          <th>Course Name</th>
          <th>Credits</th>
          <th>Marks</th>
          <th>Points</th>
          <th>Grade</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <!-- Rows will be added here -->
      </tbody>
    </table>

    <div class="result-area">
      <button onclick="calculateGPA()" class="btn btn-primary"
        style="margin-bottom: 0.5rem; max-width: 200px;">Calculate GPA</button>
      <div id="result" class="gpa-display">GPA: 0.00</div>
    </div>
  </div>

  <footer>
    <p>Designed & Developed by <span class="footer-name">Hafiz Muhammad
        Saad</span></p>
  </footer>

  <script>
    let courses = [];

    // Theme Toggle Logic
    const themeToggle = document.getElementById('themeToggle');
    const prefersDarkScheme = window.matchMedia("(prefers-color-scheme: dark)");

    // Check local storage or system preference
    const currentTheme = localStorage.getItem("theme");
    if (currentTheme == "dark") {
      document.body.setAttribute("data-theme", "dark");
      themeToggle.checked = true;
    } else if (currentTheme == "light") {
      document.body.setAttribute("data-theme", "light");
      themeToggle.checked = false;
    } else if (prefersDarkScheme.matches) {
      document.body.setAttribute("data-theme", "dark");
      themeToggle.checked = true;
    }

    themeToggle.addEventListener("change", function () {
      if (this.checked) {
        document.body.setAttribute("data-theme", "dark");
        localStorage.setItem("theme", "dark");
      } else {
        document.body.setAttribute("data-theme", "light");
        localStorage.setItem("theme", "light");
      }
    });

    function getGradeDetails(marks) {
      if (marks >= 90) return { gradePoint: 4.0, letter: "A+" };
      if (marks >= 80) return { gradePoint: 4.0, letter: "A" };
      if (marks >= 79) return { gradePoint: 3.9, letter: "A-" };
      if (marks >= 78) return { gradePoint: 3.8, letter: "A-" };
      if (marks >= 77) return { gradePoint: 3.7, letter: "B+" };
      if (marks >= 76) return { gradePoint: 3.6, letter: "B+" };
      if (marks >= 75) return { gradePoint: 3.5, letter: "B+" };
      if (marks >= 74) return { gradePoint: 3.4, letter: "B+" };
      if (marks >= 73) return { gradePoint: 3.3, letter: "B" };
      if (marks >= 72) return { gradePoint: 3.2, letter: "B" };
      if (marks >= 71) return { gradePoint: 3.1, letter: "B" };
      if (marks >= 70) return { gradePoint: 3.0, letter: "B" };
      if (marks >= 69) return { gradePoint: 2.9, letter: "B-" };
      if (marks >= 68) return { gradePoint: 2.8, letter: "B-" };
      if (marks >= 67) return { gradePoint: 2.7, letter: "C+" };
      if (marks >= 66) return { gradePoint: 2.6, letter: "C+" };
      if (marks >= 65) return { gradePoint: 2.5, letter: "C+" };
      if (marks >= 64) return { gradePoint: 2.4, letter: "C+" };
      if (marks >= 63) return { gradePoint: 2.3, letter: "C" };
      if (marks >= 62) return { gradePoint: 2.2, letter: "C" };
      if (marks >= 61) return { gradePoint: 2.1, letter: "C" };
      if (marks >= 60) return { gradePoint: 2.0, letter: "C" };
      if (marks >= 59) return { gradePoint: 1.9, letter: "C-" };
      if (marks >= 58) return { gradePoint: 1.8, letter: "C-" };
      if (marks >= 57) return { gradePoint: 1.7, letter: "D+" };
      if (marks >= 56) return { gradePoint: 1.6, letter: "D+" };
      if (marks >= 55) return { gradePoint: 1.5, letter: "D+" };
      if (marks >= 54) return { gradePoint: 1.4, letter: "D+" };
      if (marks >= 53) return { gradePoint: 1.3, letter: "D" };
      if (marks >= 52) return { gradePoint: 1.2, letter: "D" };
      if (marks >= 51) return { gradePoint: 1.1, letter: "D" };
      if (marks >= 50) return { gradePoint: 1.0, letter: "D" };
      return { gradePoint: 0.0, letter: "F" };
    }

    function renderCourses() {
      let tbody = document.querySelector("#courseTable tbody");
      tbody.innerHTML = ""; // Clear existing rows

      courses.forEach((course, index) => {
        let row = tbody.insertRow();

        let cName = row.insertCell(0);
        cName.innerText = course.name;
        cName.setAttribute('data-label', 'Course Name');

        let cCredit = row.insertCell(1);
        cCredit.innerText = course.credit;
        cCredit.setAttribute('data-label', 'Credits');

        let cMarks = row.insertCell(2);
        cMarks.innerText = course.marks;
        cMarks.setAttribute('data-label', 'Marks');

        let cPoints = row.insertCell(3);
        cPoints.innerText = course.gradePoint;
        cPoints.setAttribute('data-label', 'Points');

        let gradeCell = row.insertCell(4);
        gradeCell.setAttribute('data-label', 'Grade');
        let gradeSpan = document.createElement("span");
        gradeSpan.innerText = course.letter;
        gradeSpan.className = "grade-tag";

        if (course.letter === "A" || course.letter === "A+") {
          gradeSpan.classList.add("grade-good");
        } else if (course.letter === "F") {
          gradeSpan.classList.add("grade-bad");
        }
        gradeCell.appendChild(gradeSpan);


        let deleteCell = row.insertCell(5);
        deleteCell.setAttribute('data-label', 'Action');
        let deleteButton = document.createElement("button");
        deleteButton.innerText = "Delete";
        deleteButton.className = "btn btn-danger";
        deleteButton.onclick = function () {
          deleteCourse(index);
        };
        deleteCell.appendChild(deleteButton);
      });
    }

    function addCourse() {
      let nameInp = document.getElementById("courseName");
      let creditInp = document.getElementById("creditHours");
      let marksInp = document.getElementById("marks");

      let name = nameInp.value.trim();
      let credit = parseFloat(creditInp.value);
      let marks = parseFloat(marksInp.value);

      document.getElementById("nameError").innerText = "";
      document.getElementById("creditError").innerText = "";
      document.getElementById("marksError").innerText = "";

      let isValid = true; // Use flag to check all errors at once

      let nameRegex = /^[A-Za-z\s]+$/;
      if (!nameRegex.test(name)) {
        document.getElementById("nameError").innerText = "Only letters allowed.";
        isValid = false;
      }

      if (credit < 1 || credit > 4 || isNaN(credit)) {
        document.getElementById("creditError").innerText = "1-4 credits only.";
        isValid = false;
      }

      if (marks <= 0 || marks > 100 || isNaN(marks)) {
        document.getElementById("marksError").innerText = "0-100 marks only.";
        isValid = false;
      }

      if (!isValid) return;

      let { gradePoint, letter } = getGradeDetails(marks);

      courses.push({ name, credit, marks, gradePoint, letter });

      renderCourses();

      nameInp.value = "";
      creditInp.value = "";
      marksInp.value = "";
      nameInp.focus();
    }

    function deleteCourse(index) {
      courses.splice(index, 1);
      renderCourses();
    }

    function calculateGPA() {
      let totalPoints = 0,
        totalCredits = 0;
      courses.forEach((course) => {
        totalPoints += course.credit * course.gradePoint;
        totalCredits += course.credit;
      });
      let gpa = totalCredits ? (totalPoints / totalCredits).toFixed(2) : 0;
      document.getElementById("result").innerText = "GPA: " + gpa;
    }
  </script>
</body>

</html>
